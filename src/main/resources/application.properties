spring.application.name=authorization-server

#postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/anime
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.validation-timeout=10000
#spring.jpa.hibernate.ddl-auto=update

#jwt
key.private.path=${PRIVATE_KEY_PATH}
key.public.path=${PUBLIC_KEY_PATH}
jwt.access.expiration=600000
jwt.refresh.expiration=2629800000
spring.security.oauth2.authorizationserver.issuer=http://localhost:8080

# OAuth2 Client Redirect URIs (configure via env for production)
oauth2.client.user-frontend.redirect-uri=${USER_FRONTEND_URL:http://localhost:5173}
oauth2.client.admin-frontend.redirect-uri=${ADMIN_FRONTEND_URL:http://localhost:5174}

#recaptcha
google.recaptcha.key.secret=${GOOGLE_SECRET}
google.recaptcha.key.site=${GOOGLE_SITE}

#google oauth2 login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# gRPC Server
spring.grpc.server.port=9090

#redis (only for cache, sessions are in database)
spring.cache.type=redis
spring.data.redis.host=${CACHE_HOST}
spring.data.redis.port=${CACHE_PORT}
spring.data.redis.password=${CACHE_PASSWORD}

# Disable Redis sessions - use database instead
spring.session.store-type=none